name: Fetch course thumbnails (one-off)
on:
  push:
    branches: [redesign]
    paths: [.github/workflows/fetch-thumbnails.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-thumbnails.mjs
      - run: |
          git add src/data/courses.json public/courses
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git commit -m "Self-host course thumbnails"
          git push
