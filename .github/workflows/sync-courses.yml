name: Sync Udemy courses

on:
  schedule:
    - cron: "17 9 * * 1" # Mondays 09:17 UTC
  workflow_dispatch:
  push:
    branches: [redesign] # shortcut: seeds data on the redesign branch, remove before merge
    paths: [scripts/sync-courses.mjs, .github/workflows/sync-courses.yml]

permissions:
  contents: write

concurrency:
  group: sync-courses-${{ github.ref }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node scripts/sync-courses.mjs
      - name: Commit catalogue changes
        run: |
          git add src/data public/courses
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync Udemy course catalogue"
          git push
